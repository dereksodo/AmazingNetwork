name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the backend exists
        id: has_backend
        run: test -f backend/requirements-dev.txt && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "No backend yet; skipping."
      - uses: actions/setup-python@v5
        if: steps.has_backend.outputs.yes == 'true'
        with:
          python-version: "3.12"
      - if: steps.has_backend.outputs.yes == 'true'
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - if: steps.has_backend.outputs.yes == 'true'
        working-directory: backend
        run: pytest

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
